description: >-
  Novell publishes no API plans, tiers or pricing, and there is nothing to price: both API surfaces run on
  software the customer has already licensed and hosts themselves, so access to the API is a property of the
  product licence rather than a separate subscription. There is no metered API product, no free tier, no
  developer sign-up and no rate card. The Novell Developer Kit itself was free to download under the Novell
  Developer License Agreement ("Your use of these files is subject to the Novell Developer License Agreement
  unless different license terms accompany the file itself"), which is stated on every NDK component page.
model: bundled-with-product-licence
