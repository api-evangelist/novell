signup_note: >-
  No developer sign-up exists. The account surfaces on novell.com (Customer Center, My Profile, My Products)
  are licence-management for existing customers and now redirect into the OpenText SAML SSO at
  extlogin.opentext.com. Product licensing is sold through Volume Licensing and Buying Programs and through
  partners, not self-serve.
