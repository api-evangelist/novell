apis:
  - aid: novell:groupwise-administration-rest-api
    name: GroupWise Administration REST API
    description: >-
      REST/JSON administration API for a GroupWise system, served by the GroupWise Administration Service that installs
      alongside the GroupWise agents. Introduced under the "Windermere" codename for GroupWise 2014. The published
      reference lists 220 resource paths and 357 operations (166 GET, 69 PUT, 68 POST, 54 DELETE) across nine groups -
      api, application, async, diagnostics, domains, node, object, prefs and system - covering domains, post offices,
      users, groups, resources, libraries, gateways, MTAs, POAs, LDAP servers, internet domains, move requests and
      restore areas. Requests and responses are available as application/json or application/xml. The service is
      customer-hosted; there is no Novell-operated endpoint.
    humanURL: https://www.novell.com/documentation/groupwise25/gwsdk_admin_rest_api/data/bookinfo.html
    baseURL: https://{server_address}:9710/gwadmin-service
    image: https://www.novell.com/favicon.ico
    tags:
      - collaboration
      - email
      - administration
      - rest
      - self_hosted
    properties:
      - type: Documentation
        url: https://www.novell.com/documentation/groupwise25/gwsdk_admin_rest_api/data/bookinfo.html
      - type: APIReference
        url: https://www.novell.com/documentation/developer/groupwise_sdk/gwsdk_gwadminweb/data/application.htm
      - type: DataModel
        url: data-model/novell-data-model.yml
  - aid: novell:groupwise-web-services-soap
    name: GroupWise Web Services (SOAP)
    description: >-
      Server-side SOAP protocol for reading and writing a GroupWise user's mailbox, spoken directly to the GroupWise
      Post Office Agent over HTTP/HTTPS. 96 documented methods defined in the methods.xsd schema, from loginRequest and
      getItemsRequest through createItemRequest, sendItemRequest, moveItemsRequest, purgeDeletedItemsRequest and
      restoreItemRequest, plus a companion GroupWise Web Services Events surface for mailbox event notification.
      Authentication is a plain-text user credential or a GroupWise Trusted Application name and key, returning a
      session key that every subsequent call carries. Customer-hosted: the endpoint is the POA, default port 7191.
    humanURL: https://www.novell.com/developer/ndk/groupwise/groupwise_web_service_(soap).html
    baseURL: https://{poa_address}:7191/soap
    image: https://www.novell.com/favicon.ico
    tags:
      - collaboration
      - email
      - calendar
      - soap
      - self_hosted
    properties:
      - type: Documentation
        url: https://www.novell.com/documentation/groupwise25/gwsdk_web_services/data/bktitle.html
      - type: APIReference
        url: https://www.novell.com/documentation/groupwise25/gwsdk_web_services/data/b8cg4px.html
      - type: ErrorCatalog
        url: errors/novell-error-codes.yml
  - aid: novell:dsml-for-edirectory-soap
    name: DSML for eDirectory (SOAP)
    description: >-
      DSML v2 for eDirectory ships a deployable Java web archive (.war) that exposes Novell eDirectory as a SOAP web
      service using DSML - the OASIS Directory Services Markup Language standard for representing directory information
      as XML. Customer-deployed inside a servlet container against a local eDirectory tree. The NDK page is still
      indexed on novell.com but now 301s to the Micro Focus eDirectory developer documentation; the last published
      build is novell-dsml-devel-2006.02.22 and every download link on the page 404s.
    humanURL: https://www.microfocus.com/documentation/edirectory-developer-documentation/dsml-for-edirectory-soap/
    image: https://www.novell.com/favicon.ico
    tags:
      - directory_services
      - identity
      - ldap
      - soap
      - self_hosted
    properties:
      - type: Documentation
        url: https://www.microfocus.com/documentation/edirectory-developer-documentation/dsml-for-edirectory-soap/
