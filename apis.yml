aid: novell
name: Novell
description: >-
  Novell, Inc. was a Provo, Utah network-software company best known for NetWare, eDirectory, GroupWise and ZENworks.
  It was acquired by The Attachmate Group in 2011, folded into Micro Focus with the 2014 Attachmate acquisition, and
  passed to OpenText when OpenText bought Micro Focus in 2023. The Novell corporate brand is retired and novell.com is
  now an OpenText-operated redirector, but a large part of the Novell developer surface is still served on
  www.novell.com and is not merely archival: the Novell Developer Kit (NDK) A-Z index, the eDirectory developer kits
  (which now 301 to microfocus.com), and the GroupWise SDK documentation set published per release right up to
  GroupWise 25. Two callable API surfaces are documented there - the GroupWise Administration REST API (220 resource
  paths, 357 operations, served by the customer's own GroupWise Administration Service on port 9710) and the GroupWise
  Web Services SOAP protocol against the Post Office Agent (96 documented methods on port 7191). Both are
  customer-hosted, not SaaS: there is no Novell-operated endpoint, no key to obtain and no sign-up. No machine-readable
  contract is obtainable - a WSDL is referenced by name but shipped only inside SDK archives on hosts that no longer
  resolve, and the Admin API's WADL is generated at runtime on the customer's own server. The documentation outlived
  the distribution.
