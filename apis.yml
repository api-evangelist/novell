  detail: >-
    Novell's brand is retired and novell.com is an OpenText-operated redirector, but the developer surface is
    genuinely readable and was profiled from it: the NDK A-Z index, the GroupWise SDK documentation set
    published per release up to GroupWise 25, a live vulnerability disclosure program, a 22-family error-code
    registry and two first-party client libraries on public registries. What does not exist is a
    machine-readable contract - the GroupWise SOAP WSDL is referenced by name but shipped only inside
    novell-gwsoap-devel-2013.01.15.zip on ftp://sdk.provo.novell.com, which no longer resolves, and the
    Administration REST API's WADL is generated at runtime on the customer's own server.
