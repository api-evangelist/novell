    registry: maven
    official: true
    language: java
    url: https://central.sonatype.com/artifact/com.novell.ldap/jldap
    docs: https://www.microfocus.com/documentation/edirectory-developer-documentation/ldap-classes-for-java/
    version: '2009-10-07'
    published: '2013-02-19'
    note: >-
      Novell LDAP Classes for Java (JLDAP). The only version on Maven Central; the version string is itself a
      date, and maven-metadata.xml records lastUpdated 2013-02-26. The NDK page it documents now 301s to the
      Micro Focus eDirectory developer documentation. Unmaintained for over a decade.
    verified: https://repo1.maven.org/maven2/com/novell/ldap/jldap/maven-metadata.xml
  - name: Novell.Directory.Ldap
    registry: nuget
    official: true
    language: csharp
    url: https://www.nuget.org/packages/Novell.Directory.Ldap
    docs: https://www.microfocus.com/documentation/edirectory-developer-documentation/ldap-libraries-for-c-sharp/
    version: 2.2.1
    published: '2014-02-12'
    note: >-
      LDAP Libraries for C#. Registry metadata names the author as "Novell Inc." and points projectUrl at
      https://www.novell.com/developer/ndk/ldap_libraries_for_c_sharp.html, so first-party authorship is
      unambiguous. Exactly one version has ever been published. This is the newest first-party Novell release
      on any package registry.
    verified: https://api.nuget.org/v3/registration5-semver1/novell.directory.ldap/index.json
  - name: Novell.Directory.Ldap.NETStandard
    registry: nuget
    official: false
    language: csharp
    url: https://www.nuget.org/packages/Novell.Directory.Ldap.NETStandard
    repository: https://github.com/dsbenghe/Novell.Directory.Ldap.NETStandard
    version: 4.0.0
    published: '2025-03-02'
    note: >-
      Community continuation of the Novell C# LDAP library, maintained by dsbenghe. The registry author field
      reads "Novell,dsbenghe" because it inherits Novell's copyright, but projectUrl is a third-party GitHub
      repository and no Novell host references it - recorded as official:false. Listed because it is the only
      live descendant of a Novell client library, and is the package a current integrator would actually use.
