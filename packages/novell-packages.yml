source: https://www.novell.com/developer/ndk/
name: Novell client libraries and SDKs
description: >-
  First-party Novell client libraries located on public package registries, plus the registry-less developer
  kits the Novell Developer Kit (NDK) A-Z index still lists. Registries swept 2026-09-13: npm, PyPI, Maven
  Central, NuGet, RubyGems, crates.io, Packagist. Only two first-party packages exist on any registry, and
  both are abandoned - the newest first-party release Novell ever published to a registry is 2014-02-12. Every
  remaining NDK component is distributed as a downloadable archive and all of those download hosts are now
  dead (ftp://sdk.provo.novell.com does not resolve; the HTTP archive paths under www.novell.com/developer/
  return 404).
summary:
  registry_packages: 3
  official_first_party: 2
  newest_first_party_release: '2014-02-12'
  registry_less_kits: 5
packages:
