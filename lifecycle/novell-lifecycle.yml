    - what: NDK archive mirrors under www.novell.com/developer/
      status: 404
    - what: download.novell.com
      status: 503
    - what: developer.novell.com
      status: nxdomain
    - what: Newest first-party SDK release on any package registry
      value: '2014-02-12'
      url: https://www.nuget.org/packages/Novell.Directory.Ldap
  note: >-
    The Novell Developer Kit A-Z index and every component page are still served and readable, but nothing
    on them can be downloaded. The documentation outlived the distribution.
