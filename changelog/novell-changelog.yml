name: Novell GroupWise SDK change log
description: >-
  Novell publishes no product-wide API changelog and no dated release-notes feed. What it does publish - and
  has published continuously since 2007 - is a per-guide Revision History appendix inside each SDK document,
  listing every documentation release in reverse chronological order with the specific methods, elements and
  sections added or changed. That is a genuine dated changelog for the SOAP contract, and it is the only one
  either surface has. It is recorded here as-is. Note the discontinuity: the GroupWise 25 Web Services guide
  DROPPED the Revision History section entirely (its table of contents is Overview, Methods, Schema Elements
  and nothing else), so the last dated API change log entry Novell published is June 2013.
