entries:
  - date: '2013-06'
    version: GroupWise Web Services documentation, June 2013
    breaking: false
    additions: []
    highlights:
      - Clarified the message/RTF view string in Section 1.17.3, Views.
  - date: '2012-11'
    version: GroupWise Web Services documentation, November 2012
    breaking: true
    highlights:
      - Reviewed and updated for use with GroupWise 2012.
      - Removed the username element from the TrustedApplication element because it is no longer valid.
      - Added the mainVersion element to the Proxy element.
      - Updated the links for TCP trace utilities in Section 1.7.1, Trace Utilities.
    breaking_note: >-
      The TrustedApplication username element removal is a contract change to the highest-privilege
      authentication path on the API.
  - date: '2011-10'
    version: GroupWise Web Services documentation, October 2011 (GroupWise 2012)
    breaking: false
    additions:
      - archiveRequest
      - unarchiveRequest
      - createNotifyRequest
      - modifyNotifyRequest
      - removeNotifyRequest
      - getNotifyListRequest
      - getArchiveItemsRequest
      - getContactHistoryFilterRequest
      - moveItemRequest
      - moveItemsRequest
      - resendRequest
      - streamedSearchRequest
    highlights:
      - Largest single release in the history - added twelve methods plus new schema elements including CalendarPublish, CalendarPublishRange, CalHost, CategoryFlags, FolderFlags, GeneralAccount, HTMLImages and DiskSpaceUsage.
      - Added new sections for Stubbed Items, Streaming Attachments, ContactNotes on a Contact, Display Settings and Item Modification.
      - Extended getItemsRequest, getUnreadRequest, getUserListRequest, getFreeBusyRequest, loginRequest, createCursorRequest, positionCursorRequest and acceptShareRequest.
