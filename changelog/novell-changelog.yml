gaps:
  - what: No changelog for the Administration REST API
    note: >-
      Neither the GroupWise 2014 nor the GroupWise 25 Administration REST API guide carries a Revision
      History section. The base-URL port change from 9999 to 9710 between those two releases - a breaking
      change - is discoverable only by reading both guides side by side.
  - what: No dated entries after June 2013
    note: >-
      Twelve years of GroupWise releases (2014, 2014 R2, 18, 25) have shipped since the last dated API
      changelog entry. The SDK guides were re-published per release but the change history was not carried
      forward.
